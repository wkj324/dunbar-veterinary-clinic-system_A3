{% extends "base.html" %}
{% block content %}
  <h2>Clients</h2>
  <form method="get" action="{{ url_for('client_list') }}">
    <label>Search by name/phone:</label>
    <input type="text" name="q" value="{{ q }}">
    <input type="submit" value="Search">
  </form>
  <p><a href="{{ url_for('client_new') }}">Add client</a></p>
  <table>
    <tr><th>Name</th><th>Phone</th><th>Type</th></tr>
    {% for c in rows %}
      <tr><td><a href="{{ url_for('client_view', client_id=c.id) }}">{{ c.name }}</a></td>
          <td>{{ c.phone }}</td><td>{{ c.client_type }}</td></tr>
    {% else %}
      <tr><td colspan="3">No clients found.</td></tr>
    {% endfor %}
  </table>
{% endblock %}

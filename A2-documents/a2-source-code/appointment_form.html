{% extends "base.html" %}
{% block content %}
  <h2>Book appointment</h2>
  <form method="get" action="{{ url_for('appointment_book') }}">
    <label>Client:</label>
    <select name="client_id">
      <option value="">— choose —</option>
      {% for c in clients %}
        <option value="{{ c.id }}" {{ 'selected' if client_id == c.id else '' }}>{{ c.name }}</option>
      {% endfor %}
    </select>
    <label>Type:</label>
    <select name="kind">
      <option value="consultation" {{ 'selected' if kind == 'consultation' else '' }}>Consultation</option>
      <option value="farm_visit" {{ 'selected' if kind == 'farm_visit' else '' }}>Farm visit</option>
    </select>
    <input type="submit" value="Select client">
  </form>

  {% if client_id %}
    <form method="post">
      <input type="hidden" name="kind" value="{{ kind }}">
      <input type="hidden" name="client_id" value="{{ client_id }}">
      <label>Date:</label><input type="date" name="day" required><br>
      <label>Start time:</label><input type="time" name="start_time" required><br>
      {% if kind == 'consultation' %}
        <label>Animal *:</label>
        <select name="animal_id" required>
          {% for a in animals %}<option value="{{ a.id }}">{{ a.name }} ({{ a.species }})</option>{% endfor %}
        </select><br>
        <label>Room:</label>
        <select name="room"><option value="1">Room 1</option><option value="2">Room 2</option></select><br>
      {% else %}
        <label>Property *:</label>
        <select name="property_id" required>
          {% for p in props %}<option value="{{ p.id }}">{{ p.name }}, {{ p.locality }}</option>{% endfor %}
        </select><br>
        <label>Est. duration (hours) *:</label><input type="number" step="0.5" min="0.5" name="duration_hours" required><br>
      {% endif %}
      <label>Reason:</label><input type="text" name="reason"><br>
      <input type="submit" value="Book">
    </form>
  {% else %}
    <p>Choose a client and appointment type above to continue.</p>
  {% endif %}
{% endblock %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dunbar Vet Clinic</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
    nav a { margin-right: 14px; text-decoration: none; color: #17365d; font-weight: bold; }
    table { border-collapse: collapse; margin: 14px 0; width: 100%; }
    th, td { border: 1px solid #b8c7d9; padding: 6px 8px; text-align: left; font-size: 14px; }
    th { background: #5b9bd5; color: #fff; }
    .cancelled { color: #c00000; }
    .flash-error { color: #c00000; font-weight: bold; }
    .flash-ok { color: #2e7d32; font-weight: bold; }
    label { display: inline-block; width: 160px; }
    input, select { margin: 4px 0; padding: 4px; }
    input[type=submit] { padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Dunbar Veterinary Clinic</h1>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('client_list') }}">Clients</a>
    <a href="{{ url_for('animal_list') }}">Animals</a>
    <a href="{{ url_for('appointment_book') }}">Book appointment</a>
  </nav>
  <hr>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <p class="flash-{{ cat }}">{{ msg }}</p>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
